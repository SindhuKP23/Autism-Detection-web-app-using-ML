<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register Account</title>
    <style>
        body { 
            background: linear-gradient(rgba(18, 18, 24, 0.9), rgba(18, 18, 24, 0.9)), 
                        url('https://upload.wikimedia.org/wikipedia/commons/e/e0/Autism_puzzle_heart.svg') no-repeat center center fixed; 
            background-size: contain;
            background-color: #121212;
            color: #fff; 
            font-family: sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .card { 
            background: rgba(30, 30, 30, 0.85); 
            backdrop-filter: blur(8px);
            padding: 40px; 
            border-radius: 12px; 
            width: 340px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
            text-align: center; 
            box-sizing: border-box;
        }
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 12px 0; 
            background: #2d2d2d; 
            border: 1px solid #444; 
            border-radius: 6px; 
            color: #fff; 
            box-sizing: border-box; 
            display: block;
        }
        button { 
            width: 100%; 
            padding: 12px; 
            background: #03dac6; 
            border: none; 
            border-radius: 6px; 
            color: #121212; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 16px; 
            margin-top: 10px; 
            box-sizing: border-box;
        }
        a { color: #03dac6; text-decoration: none; font-size: 14px; }
        .flash { color: #ff6b6b; margin-bottom: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Register Account</h2>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}<div class="flash">{{ message }}</div>{% endfor %}
            {% endif %}
        {% endwith %}
        <form action="/signup" method="POST">
            <input type="text" name="username" placeholder="Choose Username" required>
            <input type="password" name="password" placeholder="Choose Password" required>
            <button type="submit">Sign Up</button>
        </form>
        <p style="margin-top:20px; font-size:14px;">Registered? <a href="/login">Login here</a></p>
    </div>
</body>
</html>
