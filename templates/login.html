<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign In - ASD Portal</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 40px; border-radius: 12px; width: 320px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #2d2d2d; border: 1px solid #444; border-radius: 6px; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #bb86fc; border: none; border-radius: 6px; color: #121212; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
        bbody { 
    background: linear-gradient(rgba(18, 18, 24, 0.88), rgba(18, 18, 24, 0.88)), 
                url('https://upload.wikimedia.org/wikipedia/commons/e/e0/Autism_puzzle_heart.svg') no-repeat center center fixed; 
    background-size: contain;
    background-color: #121212;
    color: #fff; 
    font-family: sans-serif; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    height: 100vh; 
    margin: 0; 
}
    </style>
</head>
<body>
    <div class="card">
        <h2>Sign In</h2>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}<div class="flash">{{ message }}</div>{% endfor %}
            {% endif %}
        {% endwith %}
        <form action="/login" method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <p style="margin-top:20px; font-size:14px;">New user? <a href="/signup">Create account</a></p>
    </div>
</body>
</html>
